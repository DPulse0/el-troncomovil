<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta VIP - El Troncomovil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background-color: #111827; border: 1px solid #1f293d; border-radius: 16px; padding: 25px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); text-align: center; }
        
        h1 { font-size: 1.4rem; color: #f59e0b; margin-bottom: 5px; }
        p.subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 20px; }

        /* Formulario de Login Inicial */
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 0.8rem; color: #9ca3af; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; background-color: #1f293d; border: 1px solid #374151; border-radius: 8px; color: white; font-size: 0.95rem; }
        input:focus { outline: none; border-color: #f59e0b; }
        
        .btn { width: 100%; background-color: #f59e0b; color: #0b0f19; border: none; padding: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        .btn:hover { background-color: #d97706; }
        
        .btn-secundario { background: transparent; border: 1px solid #f59e0b; color: #f59e0b; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; width: 100%; margin-top: 10px; font-weight: 500; }
        .btn-secundario:hover { background: rgba(245, 158, 11, 0.1); }
        
        .btn-danger-outline { border-color: #ef4444; color: #ef4444; margin-top: 15px; }
        .btn-danger-outline:hover { background: rgba(239, 68, 68, 0.1); }

        /* Cuadrícula de Sellos Clásica con Estilo Oscuro */
        .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; justify-items: center; }
        .stamp-circle { width: 50px; height: 50px; border-radius: 50%; background: #1f293d; border: 2px dashed #4b5563; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #9ca3af; font-weight: 600; transition: all 0.3s ease; }
        .stamp-circle.filled { background: #292524; border: 2px solid #f59e0b; border-style: solid; color: #f59e0b; }

        /* Banner de Promociones Globales / Notificaciones */
        .promo-banner { background-color: #1f293d; border-left: 4px solid #f59e0b; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: left; display: none; }
        .promo-banner h4 { font-size: 0.85rem; color: #f59e0b; margin-bottom: 3px; }
        .promo-banner p { font-size: 0.8rem; color: #e5e7eb; }

        /* Tarjetas de Información (Cumpleaños y Nombre) */
        .info-box { background: #1f293d; border: 1px solid #374151; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .info-box p { font-size: 0.85rem; color: #9ca3af; }
        .info-box span { font-size: 0.95rem; font-weight: 600; color: #fff; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. SECCIÓN DE INICIO DE SESIÓN / REGISTRO POR TELÉFONO -->
        <div id="seccion-login">
            <h1>🍔 El Troncomovil</h1>
            <p class="subtitle">Ingresa tu número para ver tu tarjeta de sellos</p>
            
            <div class="form-group">
                <label>Número de Celular</label>
                <input type="tel" id="input-telefono" placeholder="Ej: 3001234567">
            </div>
            <div class="form-group">
                <label>Tu Nombre / Alias</label>
                <input type="text" id="input-nombre" placeholder="Ej: Carlos Pérez">
            </div>
            <button class="btn" onclick="iniciarSesion()">Ver mi Tarjeta VIP</button>
        </div>

        <!-- 2. SECCIÓN DE LA TARJETA VIP (CLIENTE LOGUEADO) -->
        <div id="seccion-tarjeta" class="hidden">
            <h1>🍔 Tarjeta VIP</h1>
            <p class="subtitle" id="saludo-usuario">¡Hola, Socio!</p>

            <!-- Banner de Promociones Globales / Notificaciones -->
            <div id="promo-container" class="promo-banner">
                <h4>📢 Notificación / Promoción</h4>
                <p id="texto-promo"></p>
            </div>

            <!-- Cuadrícula de Sellos (Estilo Círculos) -->
            <div class="stamps-grid" id="stamps-container">
                <!-- Se generan dinámicamente -->
            </div>
            <p style="font-size: 0.8rem; color: #f59e0b; margin-bottom: 15px;" id="mensaje-meta">¡Acumula sellos y gana premios!</p>

            <!-- Sección para Editar Nombre -->
            <div class="info-box">
                <p>Tu Nombre:</p>
                <span id="span-nombre-actual">Socio</span>
                <button class="btn-secundario" onclick="toggleEditarNombre()" style="margin-top: 6px;">✏️ Cambiar Nombre</button>
                
                <div id="form-nombre" class="hidden" style="margin-top: 10px;">
                    <input type="text" id="input-nuevo-nombre" placeholder="Nuevo nombre" style="margin-bottom: 8px;">
                    <button class="btn" onclick="guardarNombre()" style="padding: 8px;">Guardar Nombre</button>
                </div>
            </div>

            <!-- Sección de Cumpleaños -->
            <div class="info-box">
                <p>Cumpleaños registrado:</p>
                <span id="span-cumple">No registrado</span>
                
                <button class="btn-secundario" onclick="toggleEditarCumple()" style="margin-top: 6px;">🎂 Editar / Registrar Fecha</button>
                
                <div id="form-cumple" class="hidden" style="margin-top: 10px;">
                    <input type="date" id="input-nuevo-cumple" style="margin-bottom: 8px;">
                    <button class="btn" onclick="guardarCumpleanos()" style="padding: 8px;">Guardar Cumpleaños</button>
                </div>
            </div>

            <!-- Botón de Cerrar Sesión / Cambiar de número -->
            <button class="btn btn-secundario btn-danger-outline" onclick="cerrarSesion()">Cerrar Sesión / Cambiar Número</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const telefonoGuardado = localStorage.getItem('telefonoTroncomovil');
            if (telefonoGuardado) {
                cargarDatosCliente(telefonoGuardado);
            }
        });

        async function iniciarSesion() {
            const telefono = document.getElementById('input-telefono').value.trim();
            const nombre = document.getElementById('input-nombre').value.trim();

            if (!telefono || telefono.length < 7) {
                alert("Por favor ingresa un número de celular válido.");
                return;
            }

            try {
                const res = await fetch(`/api/cliente/${telefono}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre || "Socio VIP" })
                });
                const data = await res.json();

                if (data.success || data.telefono) {
                    localStorage.setItem('telefonoTroncomovil', telefono);
                    cargarDatosCliente(telefono);
                } else {
                    alert("Error al iniciar sesión.");
                }
            } catch (e) {
                console.error("Error de red", e);
            }
        }

        async function cargarDatosCliente(telefono) {
            try {
                const res = await fetch(`/api/cliente/${telefono}`);
                const cliente = await res.json();

                if (cliente && !cliente.error) {
                    document.getElementById('seccion-login').classList.add('hidden');
                    document.getElementById('seccion-tarjeta').classList.remove('hidden');

                    document.getElementById('saludo-usuario').innerText = `¡Hola, ${cliente.nombre || 'Socio'}!`;
                    document.getElementById('span-nombre-actual').innerText = cliente.nombre || "Socio VIP";
                    document.getElementById('span-cumple').innerText = cliente.cumpleanos || "No registrado";
                    
                    renderizarSellos(cliente.puntos, cliente.meta || 10);

                    if(cliente.puntos >= cliente.meta) {
                        document.getElementById('mensaje-meta').innerText = "🎉 ¡Felicidades! Tienes un premio disponible.";
                    }

                    verificarPromociones();
                    
                    // Sincronización en tiempo real cada 4 segundos (Sellos + Notificaciones)
                    setInterval(() => sincronizarEstado(telefono), 4000);
                } else {
                    cerrarSesion();
                }
            } catch (e) {
                console.error("Error al cargar perfil", e);
            }
        }

        async function sincronizarEstado(telefono) {
            try {
                // Sincronizar puntos
                const res = await fetch(`/api/cliente/${telefono}`);
                const cliente = await res.json();
                if (cliente && !cliente.error) {
                    renderizarSellos(cliente.puntos, cliente.meta || 10);
                }

                // Sincronizar notificaciones / promociones globales
                verificarPromociones();
            } catch (e) {
                console.error("Error sincronizando", e);
            }
        }

        function renderizarSellos(puntosActuales, meta) {
            const container = document.getElementById('stamps-container');
            container.innerHTML = '';

            for (let i = 1; i <= meta; i++) {
                const circulo = document.createElement('div');
                circulo.classList.add('stamp-circle');
                if (i <= puntosActuales) {
                    circulo.classList.add('filled');
                    circulo.innerText = '🍔';
                } else {
                    circulo.innerText = i;
                }
                container.appendChild(circulo);
            }
        }

        // Funciones para Editar Nombre
        function toggleEditarNombre() {
            const form = document.getElementById('form-nombre');
            form.classList.toggle('hidden');
        }

        async function guardarNombre() {
            const nuevoNombre = document.getElementById('input-nuevo-nombre').value.trim();
            const telefono = localStorage.getItem('telefonoTroncomovil');

            if (!nuevoNombre) {
                alert("Ingresa un nombre válido.");
                return;
            }

            try {
                const res = await fetch(`/api/cliente/${telefono}/nombre`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nuevoNombre })
                });
                const data = await res.json();

                if (data.success) {
                    alert("¡Nombre actualizado con éxito! ✨");
                    document.getElementById('span-nombre-actual').innerText = nuevoNombre;
                    document.getElementById('saludo-usuario').innerText = `¡Hola, ${nuevoNombre}!`;
                    document.getElementById('form-nombre').classList.add('hidden');
                } else {
                    alert("No se pudo actualizar el nombre.");
                }
            } catch (e) {
                console.error("Error al guardar nombre", e);
            }
        }

        // Funciones para Editar Cumpleaños
        function toggleEditarCumple() {
            const form = document.getElementById('form-cumple');
            form.classList.toggle('hidden');
        }

        async function guardarCumpleanos() {
            const nuevoCumple = document.getElementById('input-nuevo-cumple').value;
            const telefono = localStorage.getItem('telefonoTroncomovil');

            if (!nuevoCumple) {
                alert("Selecciona una fecha válida.");
                return;
            }

            try {
                const res = await fetch(`/api/cliente/${telefono}/cumpleanos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cumpleanos: nuevoCumple })
                });
                const data = await res.json();

                if (data.success) {
                    alert("¡Cumpleaños actualizado con éxito! 🎂");
                    document.getElementById('span-cumple').innerText = nuevoCumple;
                    document.getElementById('form-cumple').classList.add('hidden');
                } else {
                    alert("No se pudo actualizar el cumpleaños.");
                }
            } catch (e) {
                console.error("Error al guardar cumpleaños", e);
            }
        }

        // Verificar Promociones Activas
        async function verificarPromociones() {
            try {
                const res = await fetch('/api/promocion-activa');
                const promo = await res.json();
                if (promo && promo.mensaje) {
                    document.getElementById('texto-promo').innerText = promo.mensaje;
                    document.getElementById('promo-container').style.display = 'block';
                }
            } catch (e) {
                console.error("Error al verificar promos", e);
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('telefonoTroncomovil');
            location.reload();
        }
    </script>
</body>
</html>
