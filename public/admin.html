<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - El Troncomovil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            color: #f59e0b;
        }

        header a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        header a:hover {
            color: #f59e0b;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #f59e0b;
        }

        .form-group {
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background-color: #1f293d;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            resize: vertical;
            min-height: 90px;
            font-size: 0.95rem;
        }

        textarea:focus {
            outline: none;
            border-color: #f59e0b;
        }

        .btn {
            background-color: #f59e0b;
            color: #0b0f19;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #d97706;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #1f293d;
        }

        th {
            color: #9ca3af;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            color: #e5e7eb;
        }

        .btn-accion {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            margin-right: 5px;
            background-color: #f59e0b;
            color: #0b0f19;
            transition: opacity 0.2s;
        }

        .btn-accion:hover {
            opacity: 0.85;
        }

        .btn-restar {
            background-color: #d97706; /* Tono secundario para diferenciar el restar */
        }

        .btn-danger {
            background-color: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍔 Admin - El Troncomovil</h1>
        <a href="index.html">Ver Tarjeta VIP &rarr;</a>
    </header>

    <!-- Sección de Promociones / Notificaciones -->
    <div class="card">
        <h2>📢 Enviar Promoción del Día</h2>
        <div class="form-group">
            <textarea id="input-promo" placeholder="Ej: ¡Hoy 2x1 en hamburguesas artesanales de 6pm a 9pm! Ven por la tuya."></textarea>
        </div>
        <button class="btn" onclick="enviarPromocionGlobal()">Enviar Notificación a Clientes</button>
    </div>

    <!-- Sección de Clientes Registrados -->
    <div class="card">
        <h2>👥 Clientes Registrados</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Celular</th>
                        <th>Nombre</th>
                        <th>Cumpleaños</th>
                        <th>Sellos</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-clientes">
                    <!-- Los datos se cargan dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", cargarClientesAdmin);

        async function cargarClientesAdmin() {
            try {
                const res = await fetch('/api/clientes');
                const clientes = await res.json();
                
                const tbody = document.getElementById('tabla-clientes');
                tbody.innerHTML = '';

                if (clientes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af;">No hay clientes registrados aún.</td></tr>`;
                    return;
                }

                clientes.forEach(c => {
                    const tr = document.createElement('tr');
                    // Usamos c._id si tu backend lo usa, o mantenemos el teléfono como identificador principal
                    const identificador = c._id || c.telefono;
                    tr.innerHTML = `
                        <td>${c.telefono}</td>
                        <td>${c.nombre || 'Socio VIP'}</td>
                        <td>${c.cumpleanos || 'No registrada'}</td>
                        <td><strong>${c.puntos !== undefined ? c.puntos : (c.sellos || 0)}</strong></td>
                        <td>
                            <button class="btn-accion" onclick="modificarSello('${c.telefono}', 'sumar')">+ Sello</button>
                            <button class="btn-accion btn-restar" onclick="modificarSello('${c.telefono}', 'quitar')">- Sello</button>
                            <button class="btn-accion btn-danger" onclick="eliminarCliente('${c.telefono}')">Borrar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Error al cargar clientes en admin", e);
            }
        }

        async function modificarSello(telefono, tipo) {
            // tipo puede ser 'sumar' o 'quitar'
            const endpoint = tipo === 'sumar' ? `/api/cliente/${telefono}/sello` : `/api/cliente/${telefono}/quitar-sello`;
            const metodo = tipo === 'sumar' ? 'POST' : 'PUT'; // Ajusta según tu backend, aquí lo dejamos flexible

            try {
                const res = await fetch(endpoint, { method: metodo });
                const data = await res.json();
                
                // Verificamos si responde con success o de forma directa
                if (data.success || res.ok) {
                    cargarClientesAdmin();
                } else {
                    alert(data.error || data.mensaje || "No se pudo actualizar el sello");
                }
            } catch (e) {
                console.error("Error al modificar sello", e);
            }
        }

        async function eliminarCliente(telefono) {
            if(!confirm(`¿Seguro que deseas eliminar al cliente con número ${telefono}?`)) return;
            try {
                const res = await fetch(`/api/cliente/${telefono}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success || res.ok) {
                    cargarClientesAdmin();
                } else {
                    alert(data.error || "No se pudo eliminar el cliente");
                }
            } catch (e) {
                console.error("Error al eliminar cliente", e);
            }
        }

        async function enviarPromocionGlobal() {
            const mensaje = document.getElementById('input-promo').value.trim();
            if (!mensaje) {
                alert("Por favor escribe un mensaje de promoción.");
                return;
            }

            try {
                const response = await fetch('/api/admin/promocion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje })
                });

                if (response.ok) {
                    alert("¡Promoción enviada con éxito!");
                    document.getElementById('input-promo').value = "";
                } else {
                    alert("Error al enviar la promoción");
                }
            } catch (e) {
                console.error("Error al enviar promoción", e);
            }
        }
    </script>
</body>
</html>
