<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Fidelización - El Troncomovil</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card-container { width: 100%; max-width: 400px; background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; padding: 30px; text-align: center; }
        
        h1 { font-size: 1.5rem; color: #111827; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { font-size: 0.9rem; color: #6b7280; margin-bottom: 25px; }

        /* Formulario de Login Inicial */
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 0.95rem; background: #f9fafb; outline: none; transition: border 0.2s; }
        input:focus { border-color: #f59e0b; background: #fff; }
        
        .btn { width: 100%; background: #f59e0b; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #d97706; }
        
        .btn-secundario { background: transparent; border: 1px solid #d1d5db; color: #4b5563; margin-top: 10px; }
        .btn-secundario:hover { background: #f3f4f6; color: #111827; }

        .btn-danger { border-color: #fecaca; color: #dc2626; margin-top: 20px; }
        .btn-danger:hover { background: #fef2f2; }

        /* Tarjeta de Sellos (Estilo original de círculos) */
        .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; justify-items: center; }
        .stamp-circle { width: 50px; height: 50px; border-radius: 50%; background: #e5e7eb; border: 2px dashed #9ca3af; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #9ca3af; font-weight: 600; transition: all 0.3s ease; }
        .stamp-circle.filled { background: #fef3c7; border: 2px solid #f59e0b; border-style: solid; color: #d97706; }

        /* Banner de Promoción */
        .promo-banner { background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: left; display: none; }
        .promo-banner h4 { font-size: 0.85rem; color: #b45309; margin-bottom: 2px; }
        .promo-banner p { font-size: 0.8rem; color: #78350f; }

        /* Sección de Cumpleaños */
        .cumple-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-top: 15px; text-align: left; }
        .cumple-box p { font-size: 0.85rem; color: #4b5563; }
        .cumple-box span { font-weight: 600; color: #111827; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 1. PANTALLA DE INICIO DE SESIÓN / REGISTRO -->
        <div id="seccion-login">
            <h1>🍔 El Troncomovil</h1>
            <p class="subtitle">Ingresa tu número para consultar tu tarjeta VIP</p>
            
            <div class="form-group">
                <label>Número de Celular</label>
                <input type="tel" id="input-telefono" placeholder="Ej: 3001234567">
            </div>
            <div class="form-group">
                <label>Tu Nombre o Alias</label>
                <input type="text" id="input-nombre" placeholder="Ej: Carlos Pérez">
            </div>
            <button class="btn" onclick="iniciarSesion()">Ver mi Tarjeta</button>
        </div>

        <!-- 2. PANTALLA DE LA TARJETA VIP (CLIENTE LOGUEADO) -->
        <div id="seccion-tarjeta" class="hidden">
            <h1>🍔 Tarjeta VIP</h1>
            <p class="subtitle" id="saludo-usuario">¡Hola, Socio!</p>

            <!-- Banner de Promociones Globales -->
            <div id="promo-container" class="promo-banner">
                <h4>📢 Promoción Especial</h4>
                <p id="texto-promo"></p>
            </div>

            <!-- Cuadrícula de Sellos Clásica -->
            <div class="stamps-grid" id="stamps-container">
                <!-- Se generan dinámicamente mediante JS -->
            </div>
            
            <p style="font-size: 0.85rem; font-weight: 500; color: #4b5563;" id="mensaje-meta">
                ¡Acumula sellos y gana premios deliciosos!
            </p>

            <!-- Sección de Cumpleaños Integrada -->
            <div class="cumple-box">
                <p>Fecha de Cumpleaños:</p>
                <span id="span-cumple">No registrada</span>
                <button class="btn btn-secundario" style="margin-top: 8px; font-size: 0.8rem; padding: 6px;" onclick="toggleEditarCumple()">🎂 Editar Fecha</button>
                
                <div id="form-cumple" class="hidden" style="margin-top: 10px;">
                    <input type="date" id="input-nuevo-cumple" style="margin-bottom: 8px;">
                    <button class="btn" style="padding: 8px; font-size: 0.85rem;" onclick="guardarCumpleanos()">Guardar Cumpleaños</button>
                </div>
            </div>

            <!-- Botón para cerrar sesión / cambiar de número -->
            <button class="btn btn-secundario btn-danger" onclick="cerrarSesion()">Cerrar Sesión / Cambiar Número</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const telefonoGuardado = localStorage.getItem('telefonoTroncomovil');
            if (telefonoGuardado) {
                cargarDatosCliente(telefonoGuardado);
            }
        });

        async function iniciarSesion() {
            const telefono = document.getElementById('input-telefono').value.trim();
            const nombre = document.getElementById('input-nombre').value.trim();

            if (!telefono || telefono.length < 7) {
                alert("Por favor ingresa un número de celular válido.");
                return;
            }

            try {
                const res = await fetch(`/api/cliente/${telefono}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre || "Socio VIP" })
                });
                const data = await res.json();

                if (data.success || data.telefono) {
                    localStorage.setItem('telefonoTroncomovil', telefono);
                    cargarDatosCliente(telefono);
                } else {
                    alert("Error al iniciar sesión.");
                }
            } catch (e) {
                console.error("Error de red", e);
                alert("No se pudo conectar con el servidor.");
            }
        }

        async function cargarDatosCliente(telefono) {
            try {
                const res = await fetch(`/api/cliente/${telefono}`);
                const cliente = await res.json();

                if (cliente && !cliente.error) {
                    document.getElementById('seccion-login').classList.add('hidden');
                    document.getElementById('seccion-tarjeta').classList.remove('hidden');

                    document.getElementById('saludo-usuario').innerText = `¡Hola, ${cliente.nombre || 'Socio'}!`;
                    document.getElementById('span-cumple').innerText = cliente.cumpleanos || "No registrada";
                    
                    renderizarSellos(cliente.puntos, cliente.meta || 10);

                    if (cliente.puntos >= cliente.meta) {
                        document.getElementById('mensaje-meta').innerText = "🎉 ¡Felicidades! ¡Meta cumplida, reclama tu premio!";
                    }

                    verificarPromociones();
                    // Sincronización en tiempo real cada 4 segundos por si el cajero te suma un sello
                    setInterval(() => sincronizarEstado(telefono), 4000);
                } else {
                    cerrarSesion();
                }
            } catch (e) {
                console.error("Error al cargar perfil", e);
            }
        }

        async function sincronizarEstado(telefono) {
            try {
                const res = await fetch(`/api/cliente/${telefono}`);
                const cliente = await res.json();
                if (cliente && !cliente.error) {
                    renderizarSellos(cliente.puntos, cliente.meta || 10);
                }
            } catch (e) {
                console.error("Error sincronizando sellos", e);
            }
        }

        function renderizarSellos(puntosActuales, meta) {
            const container = document.getElementById('stamps-container');
            container.innerHTML = '';

            for (let i = 1; i <= meta; i++) {
                const circulo = document.createElement('div');
                circulo.classList.add('stamp-circle');
                if (i <= puntosActuales) {
                    circulo.classList.add('filled');
                    circulo.innerText = '🍔'; // Icono de sello clásico
                } else {
                    circulo.innerText = i;
                }
                container.appendChild(circulo);
            }
        }

        function toggleEditarCumple() {
            const form = document.getElementById('form-cumple');
            form.classList.toggle('hidden');
        }

        async function guardarCumpleanos() {
            const nuevoCumple = document.getElementById('input-nuevo-cumple').value;
            const telefono = localStorage.getItem('telefonoTroncomovil');

            if (!nuevoCumple) {
                alert("Por favor selecciona una fecha válida.");
                return;
            }

            try {
                const res = await fetch(`/api/cliente/${telefono}/cumpleanos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cumpleanos: nuevoCumple })
                });
                const data = await res.json();

                if (data.success) {
                    alert("¡Cumpleaños actualizado con éxito! 🎂");
                    document.getElementById('span-cumple').innerText = nuevoCumple;
                    document.getElementById('form-cumple').classList.add('hidden');
                } else {
                    alert("No se pudo actualizar el cumpleaños.");
                }
            } catch (e) {
                console.error("Error al guardar cumpleaños", e);
            }
        }

        async function verificarPromociones() {
            try {
                const res = await fetch('/api/promocion-activa');
                const promo = await res.json();
                if (promo && promo.mensaje) {
                    document.getElementById('texto-promo').innerText = promo.mensaje;
                    document.getElementById('promo-container').style.display = 'block';
                }
            } catch (e) {
                console.error("Error al verificar promos", e);
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('telefonoTroncomovil');
            location.reload();
        }
    </script>
</body>
</html>
