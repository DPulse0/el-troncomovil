<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Troncomovil - Tarjeta Digital de Fidelización</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f59e0b;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: #f59e0b;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Tarjeta VIP */
        .vip-card {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-radius: 16px;
            padding: 20px;
            color: #0b0f19;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
            margin-bottom: 25px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .edit-name-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
        }

        /* Cuadrícula de Sellos */
        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stamp-slot {
            background-color: rgba(11, 15, 25, 0.2);
            border: 2px dashed rgba(11, 15, 25, 0.4);
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .stamp-slot.filled {
            background-color: #0b0f19;
            border: 2px solid #0b0f19;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .card-footer-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: #0b0f19;
            border-top: 1px solid rgba(11, 15, 25, 0.2);
            padding-top: 10px;
        }

        /* Sección QR y Acciones */
        .qr-section {
            background-color: #111827;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .qr-section p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .qr-box img {
            width: 150px;
            height: 150px;
            display: block;
        }

        .celular-display {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .btn-notif {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-notif:hover {
            background-color: #2563eb;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="logo.png" alt="Logo El Troncomovil" class="logo" onerror="this.src='https://via.placeholder.com/80?text=VIP'">
            <h1>El Troncomovil</h1>
            <p class="subtitle">Tarjeta Digital de Fidelización</p>
        </header>

        <!-- Tarjeta VIP -->
        <div class="vip-card">
            <div class="card-header">
                <span id="nombre-socio">🍔 SOCIO VIP</span>
                <button class="edit-name-btn" onclick="cambiarNombre()" title="Editar Nombre">✏️</button>
            </div>
            
            <div class="stamps-grid" id="grid-sellos">
                <!-- Los 10 espacios de sellos se generan por JS -->
            </div>

            <div class="card-footer-text">
                ¡Completa los 10 sellos y gana una hamburguesa gratis!
            </div>
        </div>

        <!-- Sección QR -->
        <div class="qr-section">
            <p>Acércate a la tarjeta NFC en el cajero o muestra este código QR para registrar tu visita.</p>
            <div class="qr-box" id="contenedor-qr">
                <!-- El QR se genera dinámicamente -->
            </div>
            <div class="celular-display" id="texto-celular">Celular: Cargando...</div>
            <button class="btn-notif" onclick="alert('Notificaciones activadas correctamente.')">🔔 Activar Notificaciones</button>
        </div>
    </div>

    <!-- Script de la aplicación cliente -->
    <script>
        // Obtener o asignar número de celular único por localStorage para pruebas
        let telefonoCliente = localStorage.getItem('troncomovil_telefono');

        if (!telefonoCliente) {
            telefonoCliente = prompt("Por favor ingresa tu número de celular para activar tu tarjeta VIP:") || "3166835724";
            localStorage.setItem('troncomovil_telefono', telefonoCliente.trim());
        }

        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosCliente();
            generarQRCliente();
            
            // Verificar promociones al cargar y cada 4 segundos
            verificarPromociones();
            setInterval(verificarPromociones, 4000);
        });

        async function cargarDatosCliente() {
            try {
                const res = await fetch(`/api/cliente/${telefonoCliente}`);
                const cliente = await res.json();

                if (cliente) {
                    document.getElementById('nombre-socio').innerText = `🍔 ${cliente.nombre || 'SOCIO VIP'}`;
                    document.getElementById('texto-celular').innerText = `Celular: ${cliente.telefono}`;
                    renderizarSellos(cliente.puntos, cliente.meta || 10);
                }
            } catch (e) {
                console.error("Error al cargar datos del cliente", e);
            }
        }

        function renderizarSellos(puntosActuales, meta) {
            const grid = document.getElementById('grid-sellos');
            grid.innerHTML = '';

            for (let i = 0; i < meta; i++) {
                const slot = document.createElement('div');
                slot.className = `stamp-slot ${i < puntosActuales ? 'filled' : ''}`;
                slot.innerHTML = i < puntosActuales ? '🍔' : '';
                grid.appendChild(slot);
            }
        }

        function generarQRCliente() {
            const contenedorQR = document.getElementById('contenedor-qr');
            // Usamos una API pública para generar el código QR basado en el número de celular
            const urlQR = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(telefonoCliente)}`;
            contenedorQR.innerHTML = `<img src="${urlQR}" alt="Código QR VIP">`;
        }

        async function cambiarNombre() {
            const nuevoNombre = prompt("Ingresa tu nombre o apodo para la tarjeta:");
            if (!nuevoNombre) return;

            try {
                const res = await fetch(`/api/cliente/${telefonoCliente}/nombre`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nuevoNombre })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('nombre-socio').innerText = `🍔 ${data.cliente.nombre}`;
                }
            } catch (e) {
                console.error("Error al actualizar nombre", e);
            }
        }

        // --- SISTEMA DE PROMOCIONES / BANNER FLOTANTE SINCRONIZADO ---
        async function verificarPromociones() {
            try {
                const res = await fetch('/api/promocion-activa');
                const data = await res.json();
                
                if (data && data.mensaje && data.timestamp) {
                    const ultimoTimestampVisto = localStorage.getItem('ultimo_promo_visto') || 0;
                    
                    // Si hay un timestamp nuevo comparado con lo último que vio el cel, disparamos el banner
                    if (data.timestamp > Number(ultimoTimestampVisto)) {
                        mostrarBannerFlotante(data.mensaje);
                        localStorage.setItem('ultimo_promo_visto', data.timestamp);
                    }
                }
            } catch (e) {
                console.error("Error al verificar promociones", e);
            }
        }

        function mostrarBannerFlotante(mensaje) {
            let bannerExistente = document.getElementById('banner-promocion');
            if (bannerExistente) bannerExistente.remove();

            const banner = document.createElement('div');
            banner.id = 'banner-promocion';
            banner.innerHTML = `
                <div style="position: fixed; bottom: 20px; left: 20px; right: 20px; background-color: #1f293d; border: 2px solid #f59e0b; color: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 9999; display: flex; justify-content: space-between; align-items: center; animation: fadeInUp 0.3s ease;">
                    <div>
                        <strong style="color: #f59e0b; display: block; margin-bottom: 4px;">📢 ¡Nueva Promoción!</strong>
                        <span style="font-size: 0.9rem;">${mensaje}</span>
                    </div>
                    <button onclick="document.getElementById('banner-promocion').remove()" style="background: none; border: none; color: #9ca3af; font-size: 1.2rem; cursor: pointer; padding-left: 10px;">&times;</button>
                </div>
            `;
            document.body.appendChild(banner);
        }
    </script>
</body>
</html>
